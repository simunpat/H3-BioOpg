services:
  db:
    image: postgres:16
    container_name: bio_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: bio
      POSTGRES_PASSWORD: bio_pw
      POSTGRES_DB: bio_db
    ports:
      - "5432:5432"
    volumes:
      - bio_pg_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: bio_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  api:
    build:
      context: .
      dockerfile: Backend/BiografWeb.Api/Dockerfile
    container_name: bio_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5099
      ConnectionStrings__Default: Host=db;Port=5432;Database=bio_db;Username=bio;Password=bio_pw
    ports:
      - "5099:5099"
    depends_on:
      - db
    volumes:
      - .:/src

  upload:
    image: node:20-alpine
    container_name: bio_upload
    working_dir: /app
    command: ["node", "upload-server.js"]
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    ports:
      - "3001:3001"

  web:
    image: node:20
    container_name: bio_web
    working_dir: /app
    command: ["bash", "-lc", "npm install && npm run start -- --host 0.0.0.0"]
    volumes:
      - .:/app
    ports:
      - "4200:4200"
    depends_on:
      - api
      - upload

volumes:
  bio_pg_data: