<section class="container">
    <h1 class="page-title">Admin: Bookings</h1>

    <table class="table">
        <thead>
            <tr>
                <th>Movie</th>
                <th>User</th>
                <th>Seats</th>
                <th>Total</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            <tr *ngFor="let b of pagedBookings()">
                <td>{{ movieTitleForScreening(b.screeningId) }}</td>
                <td>{{ userEmail(b.userId) }}</td>
                <td>{{ displaySeats(b) }}</td>
                <td>{{ b.totalPrice }}</td>
                <td>
                    <button class="btn btn-warn" type="button" (click)="remove(b.id)">
                        Delete
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

    <div
        class="pager"
        style="
            margin: 12px 0;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
        "
    >
        <button class="btn" type="button" [disabled]="pageIndex() === 0" (click)="prevPage()">
            Prev
        </button>

        <span>Page {{ pageIndex() + 1 }} of {{ totalPages() }}</span>

        <button
            class="btn"
            type="button"
            [disabled]="pageIndex() >= totalPages() - 1"
            (click)="nextPage()"
        >
            Next
        </button>
    </div>
</section>
