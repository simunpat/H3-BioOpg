<section class="container">
    <h1 class="page-title">SQL Injection Lab</h1>

    <form class="form" (ngSubmit)="run()">
        <label class="field">
            <span class="label">Raw SQL</span>

            <textarea class="input" rows="6" [(ngModel)]="rawSql" name="rawSql"></textarea>
        </label>

        <div class="button-container">
            <button class="btn btn-primary" type="button" (click)="run()" [disabled]="loading">
                {{ loading ? 'Running…' : 'Run' }}
            </button>
        </div>
    </form>

    <h3>Results</h3>

    <pre>{{ output | json }}</pre>
</section>
