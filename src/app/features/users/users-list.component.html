<section class="container">
    <h1 class="page-title">Admin: Users</h1>

    <table class="table">
        <thead>
            <tr>
                <th>Email</th>
                <th>Admin</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let u of pagedUsers()">
                <td>{{ u.email }}</td>
                <td>{{ u.isAdmin ? 'Admin' : 'Customer' }}</td>
                <td>
                    <div class="button-container">
                        <a class="btn" [routerLink]="['/admin/users', u.id, 'edit']">Edit</a>
                        <a class="btn btn-warn" (click)="remove(u)">Delete</a>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
    <div class="pager">
        <button class="btn" type="button" [disabled]="pageIndex() === 0" (click)="prevPage()">
            Prev
        </button>

        <span>Page {{ pageIndex() + 1 }} of {{ totalPages() }}</span>

        <button
            class="btn"
            type="button"
            [disabled]="pageIndex() >= totalPages() - 1"
            (click)="nextPage()"
        >
            Next
        </button>
    </div>

    <div class="add-new--container">
        <a class="btn btn-primary" [routerLink]="['/admin/users/new']">Add New</a>
    </div>
</section>
